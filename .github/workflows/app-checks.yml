name: App checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile using SDK-compatible peers
        run: npm install --no-audit --no-fund
      - name: Verify SDK dependency alignment
        run: npm run deps:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/eonward-android-export
      - name: Commit resolved lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock aligned Expo peer dependencies [skip ci]'
            git push origin HEAD:main
          fi
