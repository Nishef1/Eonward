name: App checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify SDK dependency alignment
        run: npm run deps:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify Android and iOS native config plugins
        run: |
          EXPO_NO_GIT_STATUS=1 npx expo prebuild --platform all --no-install --clean
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          test -f ios/Eonward.xcodeproj/project.pbxproj
          test -f ios/Eonward/Info.plist
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/eonward-android-export
      - name: Verify iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/eonward-ios-export
