name: App checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify SDK dependency alignment
        run: npm run deps:check
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/eonward-android-export
