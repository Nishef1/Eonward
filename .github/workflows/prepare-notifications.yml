name: Prepare Expo notification dependency
on:
  push:
    branches: ['feat/focus-local-notifications']
permissions:
  contents: write
jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'lock expo notifications')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx expo install expo-notifications --npm
      - run: npm run deps:check
      - run: npm run typecheck
      - name: Commit locked SDK dependency
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: lock expo notifications for SDK 57"
          git push origin HEAD:feat/focus-local-notifications
