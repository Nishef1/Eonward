name: Refresh Expo SDK patch lock
on:
  push:
    paths:
      - '.github/workflows/sdk-lock-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock using Expo-supported patch versions
        run: npm install expo@~57.0.30 expo-router@~57.0.28 --package-lock-only --no-audit --no-fund
      - name: Verify reproducible dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify SDK alignment
        run: npm run deps:check
      - name: Verify TypeScript and domain
        run: |
          npm run typecheck
          npm run test:domain
      - name: Verify both JS bundles
        run: |
          npx expo export --platform android --output-dir /tmp/eonward-lock-android
          npx expo export --platform ios --output-dir /tmp/eonward-lock-ios
      - name: Commit verified npm patch lock
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: align Expo SDK 57 patch dependencies and lockfile"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
